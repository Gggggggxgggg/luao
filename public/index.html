<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Общий Lua</title>
<style>
  :root {
    --bg: #000000;
    --panel: #101010;
    --line: #262626;
    --text: #e7e8f5;
    --muted: #8c8c8c;
    --moon: #f2d98d;
    --moon-ink: #2a2306;
    --err: #ff9a9a;
    --ok: #9fd8b4;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    display: grid; grid-template-rows: auto 1fr; font-size: 15px;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .status { color: var(--muted); font-size: 13px; }
  .status b { color: var(--text); font-weight: 600; }
  .grow { flex: 1; }
  label.nick { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  input, textarea, button { font: inherit; color: inherit; }
  input[type=text] {
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; outline: none;
  }
  input[type=text]:focus, textarea:focus-visible { border-color: var(--moon); }
  button {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--moon); outline-offset: 2px; }
  button.run { background: var(--moon); color: var(--moon-ink); border-color: var(--moon); font-weight: 600; }

  [hidden] { display: none !important; }
  #authBox { display: flex; gap: 6px; align-items: center; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; width: min(340px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  dialog h2 { margin: 0 0 12px; font-size: 17px; }
  dialog label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  dialog input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: var(--text); outline: none; }
  dialog input:focus { border-color: var(--moon); }
  dialog .err { color: var(--err); font-size: 13px; min-height: 18px; margin-bottom: 6px; }
  dialog .row { display: flex; gap: 8px; }
  dialog .link { background: none; border: 0; color: var(--muted); padding: 10px 0 0; text-decoration: underline; cursor: pointer; }
  .tabs { display: flex; gap: 4px; }
  .tabs button.on { background: var(--moon); color: var(--moon-ink); border-color: var(--moon); font-weight: 600; }
  #gameTab, #doorsTab, #chessTab { min-height: 0; overflow: auto; }

  main {
    display: grid; grid-template-columns: 200px minmax(0, 1fr) 300px; min-height: 0;
  }
  aside, section { min-height: 0; display: flex; flex-direction: column; }
  .files { border-right: 1px solid var(--line); }
  .chat { border-left: 1px solid var(--line); }
  .pane-title {
    padding: 10px 12px; color: var(--muted); font-size: 13px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  #fileList { list-style: none; margin: 0; padding: 0 6px; overflow: auto; flex: 1; }
  #fileList li {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 8px; border-radius: 6px; cursor: pointer; font-family: var(--mono); font-size: 13px;
  }
  #fileList li:hover { background: var(--panel); }
  #fileList li.active { background: var(--panel); box-shadow: inset 2px 0 0 var(--moon); }
  #fileList li .del { visibility: hidden; padding: 0 6px; border: 0; background: none; color: var(--muted); }
  #fileList li:hover .del { visibility: visible; }
  #fileList li .del:hover { color: var(--err); }

  .editor-wrap { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .toolbar .cur { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  #editor {
    width: 100%; height: 100%; resize: none; border: 0; outline: none; background: var(--bg);
    padding: 14px 16px; font-family: var(--mono); font-size: 14px; line-height: 1.55; tab-size: 2;
    white-space: pre; overflow: auto;
  }
  .out-wrap { border-top: 1px solid var(--line); height: 200px; display: flex; flex-direction: column; }
  #output {
    margin: 0; padding: 8px 14px; overflow: auto; flex: 1; font-family: var(--mono); font-size: 13px;
    white-space: pre-wrap; word-break: break-word;
  }
  #output .err { color: var(--err); }
  #output .info { color: var(--muted); }
  #output div { min-height: 1.4em; }

  #messages { flex: 1; overflow: auto; padding: 4px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg .who { font-weight: 600; font-size: 13px; }
  .msg .when { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .msg .body { white-space: pre-wrap; word-break: break-word; }
  .msg.system { color: var(--muted); font-size: 13px; font-style: italic; }
  .msg.mine .who { color: var(--moon); }
  .chat form { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .chat form input { flex: 1; min-width: 0; }

  @media (max-width: 900px) {
    body { height: auto; min-height: 100%; }
    main { grid-template-columns: 1fr; }
    .files, .chat { border: 0; border-top: 1px solid var(--line); }
    #fileList { max-height: 160px; }
    #editor { min-height: 320px; }
    #messages { max-height: 260px; }
  }
  @media (prefers-reduced-motion: no-preference) { button { transition: border-color .12s; } }
</style>
</head>

<script type="text/plain" id="prelude">
-- Общая файловая система (файлы редактора), require/dofile/loadfile, io, os.
os = os or {}
local fs_read, fs_write, fs_list, fs_remove = __fs_read, __fs_write, __fs_list, __fs_remove
local out, stdin, now, nick = __out, __stdin, __now, __nick

-- require ищет модули среди общих файлов: require("utils") -> utils.lua
package.searchers[2] = function(name)
  local src = fs_read(name .. ".lua")
  if not src then return "\n\tнет общего модуля '" .. name .. "'" end
  local f, err = load(src, "=" .. name .. ".lua")
  if not f then error(err, 0) end
  return f, name .. ".lua"
end
package.searchers[3] = nil
package.searchers[4] = nil

function loadfile(name, mode, env)
  local src = fs_read(name)
  if not src then return nil, name .. ": No such file or directory" end
  if env ~= nil then return load(src, "=" .. name, mode or "bt", env) end
  return load(src, "=" .. name, mode or "bt")
end

function dofile(name)
  local f, err = loadfile(name)
  if not f then error(err, 0) end
  return f()
end

-- ===================== io =====================
local File = {}
File.__index = File
File.__name = "FILE*"
File.__tostring = function(f)
  return f.closed and "file (closed)" or ("file (" .. f.name .. ")")
end

local opened = {}

local function newfile(kind, name, mode, buf)
  local f = setmetatable({
    kind = kind, name = name, mode = mode, buf = buf or "", pos = 1,
    closed = false, dirty = false,
    canread = mode:find("r", 1, true) ~= nil or mode:find("+", 1, true) ~= nil,
    canwrite = mode:find("[wa+]") ~= nil,
    append = mode:find("a", 1, true) ~= nil,
  }, File)
  if kind == "file" then opened[#opened + 1] = f end
  return f
end

local function check(f)
  if f.closed then error("attempt to use a closed file", 3) end
end

-- stdin: когда буфер пуст, спрашиваем у пользователя через окно ввода
local function refill(f)
  if f.kind ~= "stdin" then return false end
  local s = stdin()
  if s == nil then return false end
  f.buf = f.buf:sub(f.pos) .. s .. "\n"
  f.pos = 1
  return true
end

local function read_one(f, fmt)
  if type(fmt) == "number" then
    if f.pos > #f.buf and not refill(f) then return nil end
    if fmt == 0 then return "" end
    local s = f.buf:sub(f.pos, f.pos + fmt - 1)
    f.pos = f.pos + #s
    return s
  end
  fmt = (tostring(fmt):gsub("^%*", ""))
  local c = fmt:sub(1, 1)
  if c == "a" then
    if f.pos > #f.buf then refill(f) end
    local s = f.buf:sub(f.pos)
    f.pos = #f.buf + 1
    return s
  elseif c == "l" or c == "L" then
    while true do
      local e = f.buf:find("\n", f.pos, true)
      if e then
        local line = f.buf:sub(f.pos, c == "L" and e or e - 1)
        f.pos = e + 1
        return line
      end
      if not refill(f) then break end
    end
    if f.pos > #f.buf then return nil end
    local s = f.buf:sub(f.pos)
    f.pos = #f.buf + 1
    return s
  elseif c == "n" then
    local s, e, num = f.buf:find("^%s*([+-]?%d*%.?%d+[eE][+-]?%d+)", f.pos)
    if not s then s, e, num = f.buf:find("^%s*([+-]?%d*%.?%d+)", f.pos) end
    if not s then return nil end
    f.pos = e + 1
    return tonumber(num)
  end
  error("bad argument #1 to 'read' (invalid format)", 3)
end

function File:read(...)
  check(self)
  if not self.canread then return nil, "Bad file descriptor", 9 end
  local n = select("#", ...)
  if n == 0 then return read_one(self, "l") end
  local res = {}
  for i = 1, n do
    local v = read_one(self, (select(i, ...)))
    res[i] = v
    if v == nil then return table.unpack(res, 1, i) end
  end
  return table.unpack(res, 1, n)
end

function File:write(...)
  check(self)
  local is_std = self.kind == "stdout" or self.kind == "stderr"
  if not is_std and not self.canwrite then return nil, "Bad file descriptor", 9 end
  for i = 1, select("#", ...) do
    local v = select(i, ...)
    local t = type(v)
    if t ~= "string" and t ~= "number" then
      error("bad argument #" .. i .. " to 'write' (string expected, got " .. t .. ")", 2)
    end
    local s = tostring(v)
    if is_std then
      out(s, self.kind == "stderr")
    else
      if self.append then self.pos = #self.buf + 1 end
      self.buf = self.buf:sub(1, self.pos - 1) .. s .. self.buf:sub(self.pos + #s)
      self.pos = self.pos + #s
      self.dirty = true
    end
  end
  return self
end

function File:flush()
  check(self)
  if self.kind == "file" and self.dirty then
    local ok, err = fs_write(self.name, self.buf)
    if not ok then return nil, err end
    self.dirty = false
  end
  return self
end

function File:close()
  check(self)
  local ok, err = self:flush()
  if not ok then return nil, err end
  self.closed = true
  return true
end

function File:seek(whence, offset)
  check(self)
  whence = whence or "cur"
  offset = offset or 0
  local base
  if whence == "set" then base = 0
  elseif whence == "cur" then base = self.pos - 1
  elseif whence == "end" then base = #self.buf
  else error("bad argument #1 to 'seek' (invalid option '" .. tostring(whence) .. "')", 2) end
  local np = base + offset
  if np < 0 then return nil, "Invalid argument", 22 end
  self.pos = np + 1
  return np
end

function File:setvbuf() return true end

function File:lines(...)
  check(self)
  local fmts = table.pack(...)
  return function()
    if self.closed then error("file is already closed", 2) end
    return self:read(table.unpack(fmts, 1, fmts.n))
  end
end

local stdin_f = newfile("stdin", "stdin", "r")
local stdout_f = newfile("stdout", "stdout", "w")
local stderr_f = newfile("stderr", "stderr", "w")
local cur_in, cur_out = stdin_f, stdout_f

local io_t = { stdin = stdin_f, stdout = stdout_f, stderr = stderr_f }

function io_t.open(name, mode)
  mode = mode or "r"
  if type(name) ~= "string" then
    error("bad argument #1 to 'open' (string expected, got " .. type(name) .. ")", 2)
  end
  if not mode:match("^[rwa]%+?b?$") then
    error("bad argument #2 to 'open' (invalid mode)", 2)
  end
  local existing = fs_read(name)
  local m = mode:sub(1, 1)
  if m == "r" then
    if existing == nil then return nil, name .. ": No such file or directory", 2 end
    return newfile("file", name, mode, existing)
  end
  if m == "w" then
    local ok, err = fs_write(name, "")
    if not ok then return nil, name .. ": " .. err, 13 end
    return newfile("file", name, mode, "")
  end
  if existing == nil then
    local ok, err = fs_write(name, "")
    if not ok then return nil, name .. ": " .. err, 13 end
  end
  local f = newfile("file", name, mode, existing or "")
  f.pos = #f.buf + 1
  return f
end

function io_t.close(f) return (f or cur_out):close() end
function io_t.write(...) return cur_out:write(...) end
function io_t.read(...) return cur_in:read(...) end
function io_t.flush() return cur_out:flush() end

function io_t.type(x)
  if getmetatable(x) == File then return x.closed and "closed file" or "file" end
  return nil
end

function io_t.input(f)
  if f == nil then return cur_in end
  if type(f) == "string" then
    local h, err = io_t.open(f, "r")
    if not h then error(err, 2) end
    cur_in = h
  else
    cur_in = f
  end
  return cur_in
end

function io_t.output(f)
  if f == nil then return cur_out end
  if type(f) == "string" then
    local h, err = io_t.open(f, "w")
    if not h then error(err, 2) end
    cur_out = h
  else
    cur_out = f
  end
  return cur_out
end

function io_t.lines(name, ...)
  if name == nil then return cur_in:lines(...) end
  local h, err = io_t.open(name, "r")
  if not h then error(err, 2) end
  local fmts = table.pack(...)
  return function()
    if h.closed then return nil end
    local r = table.pack(h:read(table.unpack(fmts, 1, fmts.n)))
    if r[1] == nil then
      h:close()
      return nil
    end
    return table.unpack(r, 1, r.n)
  end
end

function io_t.popen() return nil, "io.popen недоступен: в браузере нет системных процессов" end
function io_t.tmpfile() return newfile("tmp", "tmp", "w+") end

io = io_t
package.loaded.io = io_t

-- Если программа не закрыла файлы, сохраняем всё в конце запуска
function __flush_all()
  pcall(debug.sethook)
  for _, f in ipairs(opened) do
    if not f.closed and f.dirty then pcall(f.flush, f) end
  end
end

-- ===================== os =====================
function os.remove(name)
  if fs_read(name) == nil then return nil, name .. ": No such file or directory", 2 end
  local ok, err = fs_remove(name)
  if not ok then return nil, name .. ": " .. err, 1 end
  return true
end

function os.rename(a, b)
  local src = fs_read(a)
  if src == nil then return nil, a .. ": No such file or directory", 2 end
  local ok, err = fs_write(b, src)
  if not ok then return nil, b .. ": " .. err, 13 end
  local ok2, err2 = fs_remove(a)
  if not ok2 then return nil, a .. ": " .. err2, 1 end
  return true
end

function os.tmpname()
  return "tmp_" .. os.time() .. "_" .. math.random(10000, 99999) .. ".tmp"
end

local env = {
  USER = nick(), LOGNAME = nick(), HOME = "/", PWD = "/",
  LANG = "ru_RU.UTF-8", SHELL = "/bin/sh", PATH = "/bin",
}
function os.getenv(k) return env[k] end

function os.exit()
  error("\1EXIT\1", 0)
end

-- os.execute: настоящей оболочки в браузере нет, поэтому это мини-эмуляция
-- нескольких команд над общими файлами: echo ls cat touch rm mv cp pwd whoami date true false exit
function os.execute(cmd)
  if cmd == nil then return false end
  cmd = (tostring(cmd):gsub("&&", ";"))
  local code = 0
  for part in (cmd .. ";"):gmatch("([^;]*);") do
    local name = part:match("^%s*(%S+)")
    local rest = part:match("^%s*%S+%s*(.-)%s*$") or ""
    code = 0
    if name == nil or name == "true" or name == ":" then
      -- ничего не делаем
    elseif name == "false" then
      code = 1
    elseif name == "exit" then
      code = tonumber(rest) or 0
      break
    elseif name == "echo" then
      local q, inner = rest:match("^(['\"])(.*)%1$")
      out((q and inner or rest) .. "\n")
    elseif name == "pwd" then
      out("/\n")
    elseif name == "whoami" then
      out(nick() .. "\n")
    elseif name == "date" then
      out(os.date() .. "\n")
    elseif name == "ls" or name == "dir" then
      for n in fs_list():gmatch("[^\n]+") do out(n .. "\n") end
    elseif name == "cat" then
      for f in rest:gmatch("%S+") do
        local s = fs_read(f)
        if s then out(s) else out("cat: " .. f .. ": No such file or directory\n", true); code = 1 end
      end
    elseif name == "touch" then
      for f in rest:gmatch("%S+") do
        if fs_read(f) == nil then
          local ok, err = fs_write(f, "")
          if not ok then out("touch: " .. f .. ": " .. err .. "\n", true); code = 1 end
        end
      end
    elseif name == "rm" then
      for f in rest:gmatch("%S+") do
        local ok, err = os.remove(f)
        if not ok then out("rm: " .. err .. "\n", true); code = 1 end
      end
    elseif name == "mv" or name == "cp" then
      local a, b = rest:match("^(%S+)%s+(%S+)$")
      if not a then
        out(name .. ": нужно два имени файла\n", true)
        code = 1
      elseif name == "mv" then
        local ok, err = os.rename(a, b)
        if not ok then out("mv: " .. err .. "\n", true); code = 1 end
      else
        local s = fs_read(a)
        if s == nil then
          out("cp: " .. a .. ": No such file or directory\n", true)
          code = 1
        else
          local ok, err = fs_write(b, s)
          if not ok then out("cp: " .. err .. "\n", true); code = 1 end
        end
      end
    else
      out("sh: " .. name .. ": command not found\n", true)
      code = 127
    end
  end
  if code == 0 then return true, "exit", 0 end
  return nil, "exit", code
end

-- Защита от вечных циклов: 3 секунды на запуск (время ожидания ввода не считается)
local t0 = now()
pcall(debug.sethook, function()
  if now() - t0 > 3000 then error("превышен лимит времени (3 с)", 2) end
end, "", 100000)
</script>

<script src="https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const editor = $('editor'), output = $('output'), fileList = $('fileList');
  const messagesEl = $('messages'), nickEl = $('nick');

  let files = {};
  const has = (n) => Object.prototype.hasOwnProperty.call(files, n);
  let current = 'main.lua';
  let ws = null;
  let myNick = '';

  // ---------- ник ----------
  nickEl.value = localStorage.getItem('nick') || 'Гость' + Math.floor(1000 + Math.random() * 9000);
  myNick = nickEl.value;
  nickEl.addEventListener('input', () => {
    myNick = nickEl.value.trim() || 'Гость';
    localStorage.setItem('nick', nickEl.value);
  });

  // ---------- сеть ----------
  function send(obj) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen = () => { $('status').textContent = 'подключено'; };
    ws.onclose = () => {
      $('status').textContent = 'нет связи, переподключаюсь…';
      setTimeout(connect, 2000);
    };
    ws.onmessage = (e) => handle(JSON.parse(e.data));
  }
  setInterval(() => send({ type: 'ping' }), 25000);

  function handle(m) {
    if (m.type === 'init' && localStorage.getItem('token')) send({ type: 'auth', token: localStorage.getItem('token') });
    if (window.Game) window.Game.onMessage(m);
    if (window.Doors) window.Doors.onMessage(m);
    if (window.Chess) window.Chess.onMessage(m);
    switch (m.type) {
      case 'init':
        files = m.files;
        if (!has(current)) current = 'main.lua';
        renderFiles();
        openFile(current, true);
        messagesEl.innerHTML = '';
        m.chat.forEach(addMessage);
        $('online').textContent = m.online;
        break;
      case 'auth':
        if (m.name) { localStorage.setItem('userName', m.name); applyUser(m.name); }
        else { localStorage.removeItem('token'); localStorage.removeItem('userName'); applyUser(null); }
        break;
      case 'online':
        $('online').textContent = m.count;
        break;
      case 'file':
        applyRemote(m.name, m.content, m.created);
        break;
      case 'delete':
        delete files[m.name];
        if (current === m.name) { current = 'main.lua'; openFile(current, true); }
        renderFiles();
        break;
      case 'chat':
        addMessage(m.msg);
        break;
    }
  }

  // ---------- файлы ----------
  function renderFiles() {
    fileList.innerHTML = '';
    Object.keys(files).sort((a, b) => (a === 'main.lua' ? -1 : b === 'main.lua' ? 1 : a.localeCompare(b)))
      .forEach((name) => {
        const li = document.createElement('li');
        li.className = name === current ? 'active' : '';
        const span = document.createElement('span');
        span.textContent = name;
        li.appendChild(span);
        if (name !== 'main.lua') {
          const del = document.createElement('button');
          del.className = 'del'; del.textContent = '×'; del.title = 'Удалить для всех';
          del.addEventListener('click', (ev) => {
            ev.stopPropagation();
            if (confirm(`Удалить ${name} у всех?`)) send({ type: 'delete', name });
          });
          li.appendChild(del);
        }
        li.addEventListener('click', () => openFile(name));
        fileList.appendChild(li);
      });
  }

  function openFile(name, force) {
    if (!force && name === current) return;
    current = name;
    editor.value = files[name] ?? '';
    $('cur').textContent = name;
    renderFiles();
  }

  $('newFile').addEventListener('click', () => {
    let name = prompt('Имя модуля (латиница, цифры, _ и -):', 'utils');
    if (!name) return;
    name = name.trim();
    if (!/\.[a-zA-Z0-9]{1,8}$/.test(name)) name += '.lua';
    if (!/^[a-zA-Z0-9_-]{1,32}\.[a-zA-Z0-9]{1,8}$/.test(name)) { alert('Недопустимое имя файла'); return; }
    if (has(name)) { openFile(name); return; }
    send({ type: 'create', name });
    pendingOpen = name;
  });
  let pendingOpen = null;

  // ---------- совместное редактирование ----------
  editor.addEventListener('input', () => {
    files[current] = editor.value;
    send({ type: 'edit', name: current, content: editor.value });
  });

  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = editor.selectionStart, en = editor.selectionEnd;
      editor.setRangeText('  ', s, en, 'end');
      editor.dispatchEvent(new Event('input'));
    } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      run();
    }
  });

  function applyRemote(name, content, created) {
    const isNew = !has(name);
    files[name] = content;
    if (isNew) renderFiles();
    if (created && pendingOpen === name) { pendingOpen = null; openFile(name); return; }
    if (name !== current) return;

    const old = editor.value;
    if (old === content) return;
    const s = editor.selectionStart, e = editor.selectionEnd, top = editor.scrollTop, left = editor.scrollLeft;

    // сдвигаем курсор относительно изменённого участка
    const min = Math.min(old.length, content.length);
    let p = 0;
    while (p < min && old[p] === content[p]) p++;
    let q = 0;
    while (q < min - p && old[old.length - 1 - q] === content[content.length - 1 - q]) q++;
    const delta = content.length - old.length;
    const adj = (x) => (x <= p ? x : x >= old.length - q ? x + delta : p);

    editor.value = content;
    editor.setSelectionRange(adj(s), adj(e));
    editor.scrollTop = top; editor.scrollLeft = left;
  }

  // ---------- запуск Lua (fengari, в твоём браузере) ----------
  const NAME_RE = /^[a-zA-Z0-9_-]{1,32}\.[a-zA-Z0-9]{1,8}$/;
  let lineEl = null;
  let pausedMs = 0;

  // вывод без автоматического перевода строки (нужен для io.write)
  function out(text, cls) {
    text = String(text);
    if (text === '') return;
    const parts = text.split('\n');
    parts.forEach((part, i) => {
      if (i > 0) lineEl = null;
      if (part === '' && i > 0 && i === parts.length - 1) return;
      if (!lineEl) {
        lineEl = document.createElement('div');
        if (cls) lineEl.className = cls;
        output.appendChild(lineEl);
      }
      lineEl.textContent += part;
    });
    output.scrollTop = output.scrollHeight;
  }
  function printLine(text, cls) { lineEl = null; out(text + '\n', cls); }

  // запись в общий файл из Lua (io.open / os.rename / os.execute ...)
  function writeShared(name, content) {
    if (!NAME_RE.test(name)) return 'недопустимое имя файла (латиница, цифры, _ и -, расширение до 8 символов)';
    if (content.length > 100000) return 'файл слишком большой';
    if (!has(name)) {
      if (Object.keys(files).length >= 50) return 'слишком много файлов';
      files[name] = content;
      send({ type: 'create', name, content });
      renderFiles();
    } else if (files[name] !== content) {
      files[name] = content;
      send({ type: 'edit', name, content });
    }
    if (name === current && editor.value !== content) editor.value = content;
    return null;
  }

  function removeShared(name) {
    if (name === 'main.lua') return 'нельзя удалить main.lua';
    if (!has(name)) return 'нет такого файла';
    delete files[name];
    send({ type: 'delete', name });
    if (current === name) { current = 'main.lua'; openFile(current, true); }
    renderFiles();
    return null;
  }

  function run() {
    const { lua, lauxlib, lualib, to_luastring, to_jsstring } = fengari;
    const js = (v) => to_jsstring(v, undefined, undefined, true);
    const name = current;
    const source = files[name] ?? '';
    send({ type: 'ran', nick: myNick, name });
    printLine('▶ ' + name, 'info');
    pausedMs = 0;

    const L = lauxlib.luaL_newstate();
    lualib.luaL_openlibs(L);

    const def = (fname, fn) => {
      lua.lua_pushcfunction(L, fn);
      lua.lua_setglobal(L, to_luastring(fname));
    };
    const arg = (L, i) => js(lauxlib.luaL_checkstring(L, i));
    const pushNilErr = (L, err) => {
      lua.lua_pushnil(L);
      lua.lua_pushstring(L, to_luastring(err));
      return 2;
    };

    def('print', (L) => {
      const n = lua.lua_gettop(L), parts = [];
      for (let i = 1; i <= n; i++) {
        parts.push(js(lauxlib.luaL_tolstring(L, i)));
        lua.lua_pop(L, 1);
      }
      out(parts.join('\t') + '\n');
      return 0;
    });
    def('__out', (L) => {
      out(arg(L, 1), lua.lua_toboolean(L, 2) ? 'err' : undefined);
      return 0;
    });
    def('__fs_read', (L) => {
      const n = arg(L, 1);
      if (!has(n)) lua.lua_pushnil(L);
      else lua.lua_pushstring(L, to_luastring(files[n]));
      return 1;
    });
    def('__fs_write', (L) => {
      const err = writeShared(arg(L, 1), arg(L, 2));
      if (err) return pushNilErr(L, err);
      lua.lua_pushboolean(L, 1);
      return 1;
    });
    def('__fs_remove', (L) => {
      const err = removeShared(arg(L, 1));
      if (err) return pushNilErr(L, err);
      lua.lua_pushboolean(L, 1);
      return 1;
    });
    def('__fs_list', (L) => {
      lua.lua_pushstring(L, to_luastring(Object.keys(files).sort().join('\n')));
      return 1;
    });
    def('__stdin', (L) => {
      const t = Date.now();
      const r = window.prompt('Ввод для программы (io.read). «Отмена» — конец ввода:');
      pausedMs += Date.now() - t;
      if (r === null) lua.lua_pushnil(L);
      else lua.lua_pushstring(L, to_luastring(r));
      return 1;
    });
    def('__now', (L) => { lua.lua_pushnumber(L, Date.now() - pausedMs); return 1; });
    def('__nick', (L) => { lua.lua_pushstring(L, to_luastring(myNick)); return 1; });

    const exec = (code, chunk) => {
      const buf = to_luastring(code);
      let status = lauxlib.luaL_loadbuffer(L, buf, buf.length, to_luastring('=' + chunk));
      if (status === lua.LUA_OK) status = lua.lua_pcall(L, 0, 0, 0);
      if (status !== lua.LUA_OK) {
        const msg = js(lauxlib.luaL_tolstring(L, -1));
        lua.lua_pop(L, 2);
        if (!msg.startsWith('\u0001EXIT')) printLine(msg, 'err');
        return false;
      }
      return true;
    };

    if (exec($('prelude').textContent, 'prelude')) exec(source, name);

    // сохраняем файлы, которые программа не закрыла
    lua.lua_getglobal(L, to_luastring('__flush_all'));
    if (lua.lua_isfunction(L, -1)) lua.lua_pcall(L, 0, 0, 0);
    else lua.lua_pop(L, 1);
  }

  $('run').addEventListener('click', run);
  $('clear').addEventListener('click', () => { output.textContent = ''; });

  // ---------- чат ----------
  function addMessage(m) {
    const el = document.createElement('div');
    el.className = 'msg' + (m.system ? ' system' : '') + (!m.system && m.nick === myNick ? ' mine' : '');
    const time = new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (m.system) {
      el.textContent = `${m.text} · ${time}`;
    } else {
      const head = document.createElement('div');
      const who = document.createElement('span'); who.className = 'who'; who.textContent = m.nick;
      const when = document.createElement('span'); when.className = 'when'; when.textContent = time;
      head.append(who, when);
      const body = document.createElement('div'); body.className = 'body'; body.textContent = m.text;
      el.append(head, body);
    }
    const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 40;
    messagesEl.appendChild(el);
    if (atBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  $('chatForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = $('chatInput').value.trim();
    if (!text) return;
    send({ type: 'chat', nick: myNick, text });
    $('chatInput').value = '';
  });

  // ---------- вкладки и мост для игры ----------
  function showTab(name) {
    for (const t of ['code', 'game', 'doors', 'chess']) {
      $(t + 'Tab').hidden = t !== name;
      $('tab' + t[0].toUpperCase() + t.slice(1)).classList.toggle('on', t === name);
    }
    if (name !== 'game' && window.Game) window.Game.onHide();
    if (name !== 'doors' && window.Doors) window.Doors.onHide();
    if (name === 'doors' && window.Doors) window.Doors.onShow();
    if (name === 'chess' && window.Chess) window.Chess.onShow();
  }
  $('tabCode').addEventListener('click', () => showTab('code'));
  $('tabGame').addEventListener('click', () => showTab('game'));
  $('tabDoors').addEventListener('click', () => showTab('doors'));
  $('tabChess').addEventListener('click', () => showTab('chess'));
  // ---------- аккаунт ----------
  let user = null;
  let authMode = 'login';
  const dlg = $('authDlg');
  const authHeaders = { 'Content-Type': 'application/json' };

  function applyUser(name) {
    user = name || null;
    nickEl.readOnly = !!user;
    if (user) {
      nickEl.value = user;
      myNick = user;
      nickEl.title = 'Ник привязан к аккаунту';
    } else {
      nickEl.value = localStorage.getItem('nick') || nickEl.value;
      myNick = nickEl.value.trim() || 'Гость';
      nickEl.title = '';
    }
    $('btnLogin').hidden = $('btnReg').hidden = !!user;
    $('btnLogout').hidden = !user;
  }

  function openAuth(mode) {
    authMode = mode;
    const reg = mode === 'register';
    $('authTitle').textContent = reg ? 'Регистрация' : 'Вход';
    $('authSubmit').textContent = reg ? 'Создать аккаунт' : 'Войти';
    $('authSwitch').textContent = reg ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
    $('authPass2Wrap').hidden = !reg;
    $('authPass').autocomplete = reg ? 'new-password' : 'current-password';
    $('authErr').textContent = '';
    $('authPass').value = '';
    $('authPass2').value = '';
    dlg.showModal();
    $('authUser').focus();
  }

  $('btnLogin').addEventListener('click', () => openAuth('login'));
  $('btnReg').addEventListener('click', () => openAuth('register'));
  $('authSwitch').addEventListener('click', () => openAuth(authMode === 'login' ? 'register' : 'login'));
  $('authCancel').addEventListener('click', () => dlg.close());

  $('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = $('authUser').value.trim();
    const password = $('authPass').value;
    if (authMode === 'register' && password !== $('authPass2').value) {
      $('authErr').textContent = 'Пароли не совпадают';
      return;
    }
    $('authSubmit').disabled = true;
    try {
      const r = await fetch('/api/' + authMode, { method: 'POST', headers: authHeaders, body: JSON.stringify({ username, password }) });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) { $('authErr').textContent = data.error || 'Ошибка'; return; }
      localStorage.setItem('token', data.token);
      localStorage.setItem('userName', data.name);
      applyUser(data.name);
      send({ type: 'auth', token: data.token });
      dlg.close();
    } catch {
      $('authErr').textContent = 'Нет связи с сервером';
    } finally {
      $('authSubmit').disabled = false;
    }
  });

  $('btnLogout').addEventListener('click', async () => {
    try {
      await fetch('/api/logout', { method: 'POST', headers: authHeaders, body: JSON.stringify({ token: localStorage.getItem('token') }) });
    } catch { /* всё равно выходим локально */ }
    localStorage.removeItem('token');
    localStorage.removeItem('userName');
    location.reload();
  });

  if (localStorage.getItem('token') && localStorage.getItem('userName')) applyUser(localStorage.getItem('userName'));

  window.Net = { send, nick: () => myNick, user: () => user, openAuth, showGame: () => showTab('game'), showChess: () => showTab('chess') };

  connect();
})();
</script>
<script src="game.js"></script>
<script src="doors.js"></script>
<script src="chess.js"></script>
</body>
